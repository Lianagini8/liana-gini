<!DOCTYPE html>

<head>
<meta charset="utf-8">

<link rel="manifest" href="manifest.json">

<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<script>
(function(){
  try{
    if (location.search.indexOf('nored') !== -1) return;
    var w = Math.min(window.innerWidth || 9999, screen.width || 9999);
    var touch = matchMedia('(pointer:coarse)').matches;
    if ((w < 1100) || touch) location.replace('mobile.html' + location.search + location.hash);
  }catch(e){}
})();
</script>
<script src="assets/js/dc-runtime.js"></script>
<script src="assets/js/cookie-banner.js" defer></script>
<script>
// Deep links (QR codes in catalogs): sections are mounted by dc-runtime after
// load, so the browser can't jump to #consultation by itself. Wait for the
// target, then scroll to it a few times while the layout settles; stop as soon
// as the visitor scrolls on their own.
(function(){
  function go(){
    var id = decodeURIComponent((location.hash || '').slice(1));
    if (!id) return;
    var tries = 0, found = -1, stop = false;
    function quit(){ stop = true; }
    ['wheel','touchstart','keydown'].forEach(function(ev){ window.addEventListener(ev, quit, { once: true, passive: true }); });
    var t = setInterval(function(){
      tries++;
      var el = document.getElementById(id);
      if (el && !stop) { if (found < 0) found = tries; el.scrollIntoView({ block: 'start' }); }
      if (stop || (found > 0 && tries - found >= 10) || tries > 80) clearInterval(t);
    }, 120);
  }
  window.addEventListener('load', go);
  window.addEventListener('hashchange', go);
})();
</script>

</head>
<body>

<script>
// Floating "back to top" — plain DOM, independent of the dc-runtime component
// tree, so it survives regardless of which sections are mounted. Requested by
// the client so a visitor scrolled deep into the page always has a quick way
// back to the header nav instead of feeling lost.
(function () {
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.setAttribute('aria-label', 'Наверх');
  btn.textContent = '↑ Наверх';
  btn.style.cssText = 'position:fixed;right:28px;bottom:28px;z-index:500;' +
    'font-family:Manrope,sans-serif;font-size:12px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;' +
    'color:#F2EFE8;background:#541F2B;border:none;padding:13px 18px;cursor:pointer;' +
    'opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity 0.25s ease, transform 0.25s ease;';
  btn.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  document.body.appendChild(btn);
  var visible = false;
  window.addEventListener('scroll', function () {
    // Hidden near the very bottom of the page — that's the footer, and this
    // button was sitting right on top of its legal-links row down there.
    var nearBottom = window.scrollY + window.innerHeight > document.documentElement.scrollHeight - 160;
    var show = window.scrollY > 700 && !nearBottom;
    if (show === visible) return;
    visible = show;
    btn.style.opacity = show ? '1' : '0';
    btn.style.pointerEvents = show ? 'auto' : 'none';
    btn.style.transform = show ? 'translateY(0)' : 'translateY(8px)';
  }, { passive: true });
})();
</script>
